# Queue and congestion control
net.core.default_qdisc = fq
net.ipv4.tcp_congestion_control = bbr

# Listen and packet queues
net.core.somaxconn = 65535
net.core.netdev_max_backlog = 32768
net.ipv4.tcp_max_syn_backlog = 131072

# Socket memory ceilings; TCP autotuning still chooses actual usage
net.core.rmem_max = 67108864
net.core.wmem_max = 67108864
net.ipv4.tcp_rmem = 4096 131072 33554432
net.ipv4.tcp_wmem = 4096 65536 33554432

# Proxy-oriented TCP behavior
net.ipv4.tcp_fastopen = 3
net.ipv4.tcp_mtu_probing = 1
net.ipv4.tcp_slow_start_after_idle = 0
net.ipv4.tcp_syncookies = 1
net.ipv4.tcp_sack = 1
net.ipv4.tcp_timestamps = 1

# Avoid long FIN accumulation without breaking TIME_WAIT correctness
net.ipv4.tcp_fin_timeout = 20

# File descriptors for high connection counts
fs.file-max = 2097152
